<svg width="1000" height="150" viewBox="0 0 1000 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gauge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D97757"/>
      <stop offset="1" stop-color="#4D6BFE"/>
    </linearGradient>
    <style>
      .mono { font-family: 'Cascadia Code','Consolas','DejaVu Sans Mono',monospace; }
      .lbl  { font-family: 'Segoe UI','DejaVu Sans',sans-serif; }
    </style>
  </defs>

  <!-- editor area (context) -->
  <rect x="0" y="0" width="1000" height="106" fill="#1e1e2e"/>
  <!-- VS Code status bar -->
  <rect x="0" y="106" width="1000" height="44" fill="#007ACC"/>

  <!-- caption above -->
  <text x="24" y="46" class="lbl" font-size="20" fill="#8a8a99">The extension pins a live usage item to your VS Code status bar:</text>
  <text x="24" y="78" class="lbl" font-size="16" fill="#5a5a6a">percent mode · Claude.ai or GLM · with per-project cost</text>

  <!-- gauge glyph (mini icon) inside status bar -->
  <g transform="translate(20,128)">
    <path d="M -9 7 A 11 11 0 1 1 9 7" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="4" stroke-linecap="round"/>
    <path d="M -9 7 A 11 11 0 0 1 7 -8" fill="none" stroke="url(#gauge)" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- status bar text -->
  <text x="44" y="134" class="mono" font-size="20" fill="#ffffff">5h:45%  7d:62%  |  claude-glm-usage:$3.21</text>

  <!-- a typical VS Code right-side item for realism -->
  <text x="972" y="134" class="mono" font-size="18" fill="#ffffff" fill-opacity="0.9" text-anchor="end">UTF-8</text>
</svg>
